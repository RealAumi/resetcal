name = "resetcal"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Replace both IDs after creating the KV namespace (see README).
# `wrangler dev` uses local simulated KV and does not need real IDs.
[[kv_namespaces]]
binding = "RESETCAL"
id = "00000000000000000000000000000001"
preview_id = "00000000000000000000000000000002"

# Every 10 minutes (within the 5–15 minute contract).
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = false
